<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зведений Будівельний Калькулятор</title>
    <style>
        /* АВТОНОМНИЙ ДИЗАЙН — ПРАЦЮЄ БЕЗ ІНТЕРНЕТУ */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0; }
        
        header { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 24px; color: #1e293b; font-weight: 700; }
        p.subtitle { margin: 5px 0 0 0; color: #64748b; font-size: 13px; }
        
        .total-display { background: #fff; border: 2px solid #0d6efd; padding: 12px 20px; border-radius: 10px; text-align: right; box-shadow: 0 4px 6px rgba(0,0,0,0.02); width: 100%; }
        @media(min-width: 768px) { .total-display { width: auto; } h1 { font-size: 28px; } body { padding: 20px; } }
        .total-display div { font-size: 14px; color: #64748b; margin-bottom: 2px; }
        .total-display .grand-total { font-size: 22px; color: #0d6efd; font-weight: 700; border-top: 1px solid #e2e8f0; margin-top: 5px; padding-top: 5px; }
        
        .nav-tabs { display: flex; list-style: none; padding: 0; margin: 0 0 25px 0; border-bottom: 2px solid #e2e8f0; gap: 5px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .nav-tabs button { background: none; border: none; padding: 12px 15px; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s; border: 1px solid transparent; border-bottom: none; margin-bottom: -2px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; text-align: center; }
        @media(min-width: 600px) { .nav-tabs button { flex-direction: row; font-size: 15px; padding: 12px 20px; } }
        .nav-tabs button:hover { background-color: #eaedf2; color: #1e293b; }
        .nav-tabs button.active { background: #fff; color: #0d6efd; border-color: #e2e8f0; border-bottom: 2px solid #fff; }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; overflow: hidden; border: 1px solid #e2e8f0; }
        .card-header { background: #f8fafc; padding: 15px 20px; font-weight: 700; text-transform: uppercase; color: #475569; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
        
        /* Виправлення адаптивності таблиць */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 600px; }
        @media(min-width: 768px) { table { font-size: 15px; } .card-header { font-size: 14px; } }
        th { background: #f8fafc; color: #64748b; font-weight: 600; padding: 12px 15px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px 15px; border-bottom: 1px solid #edf2f7; }
        tr:hover td { background-color: #f8fafc; }
        
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; display: block; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,0.15); }
        select.form-control { height: 42px; cursor: pointer; -webkit-appearance: select; -moz-appearance: select; appearance: select; }
        .badge { background: #64748b; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-block; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: background 0.2s; gap: 8px; text-decoration: none; width: 100%; }
        @media(min-width: 576px) { .btn { width: auto; } }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-success { background: #198754; color: #fff; }
        .btn-success:hover { background: #157347; }
        .btn-info { background: #0dcaf0; color: #fff; }
        .btn-info:hover { background: #31d2f2; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #bb2d3b; }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; width: auto; }
        
        .sort-btn { background: #f1f5f9; border: 1px solid #cbd5e1; font-size: 12px; padding: 6px 10px; margin: 0 2px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #475569; }
        .sort-btn:hover { background: #cbd5e1; color: #0f172a; }

        .controls-row { display: flex; gap: 15px; align-items: flex-end; margin-bottom: 25px; flex-wrap: wrap; }
        .controls-row > div { flex: 1; min-width: 100%; }
        @media(min-width: 768px) { .controls-row > div { min-width: 250px; } }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 10px; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; width: 100%; max-width: 950px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { background: #1e293b; color: #fff; padding: 15px 20px; font-weight: 700; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header .close-modal { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; font-weight: bold; }
        .modal-body { padding: 15px; overflow-y: auto; background: #f8fafc; }
        @media(min-width: 768px) { .modal-body { padding: 30px; } }
        .modal-footer { padding: 15px 20px; background: #f1f5f9; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px; border-radius: 0 0 12px 12px; }
        
        .row-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        @media(min-width: 576px) { .row-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
        .category-badge { display: inline-flex; align-items: center; background: #334155; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 4px; }
        .category-badge span.del { color: #f87171; cursor: pointer; margin-left: 8px; font-weight: bold; }
        .category-badge span.edit { color: #60a5fa; cursor: pointer; margin-right: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🏗️ Будівельний Калькулятор</h1>
            <p class="subtitle">Автономна версія. Сортування та імпорт/експорт бази</p>
        </div>
        <div id="mainTotalDisplay" class="total-display">
            <div>Роботи: <span id="headerJobsTotal">0.00</span> грн</div>
            <div>Матеріали: <span id="headerMaterialsTotal">0.00</span> грн</div>
            <div class="grand-total">Всього: <span id="headerGrandTotal">0.00</span> грн</div>
        </div>
    </header>

    <!-- Головна навігація з надійними емодзі -->
    <div class="nav-tabs">
        <button class="tab-link active" onclick="switchTab(event, 'jobs-content')"><span>🛠️</span> Розрахунок Робіт</button>
        <button class="tab-link" onclick="switchTab(event, 'materials-content')"><span>📦</span> Розрахунок Матеріалів</button>
        <button class="tab-link" onclick="switchTab(event, 'settings-content')"><span>⚙️</span> Налаштування</button>
        <button class="tab-link" onclick="switchTab(event, 'saved-content')"><span>💾</span> Архів</button>
    </div>

    <!-- Елементи керування -->
    <div class="controls-row">
        <div>
            <label style="font-weight: 600; display:block; margin-bottom:6px;">Назва об'єкту / кошторису:</label>
            <input type="text" id="estimateName" class="form-control" value="Кошторис об'єкту (Новий)">
        </div>
        <div class="btn-group">
            <button class="btn btn-success" onclick="saveCurrentEstimate()">💾 Зберегти в архів</button>
            <button class="btn btn-info" onclick="openPreviewModal()">👁️ Перегляд</button>
            <button class="btn btn-danger" onclick="alert('Експорт PDF імітовано для автономного режиму')">📄 Завантажити PDF</button>
        </div>
    </div>

    <!-- ВКЛАДКА 1: РОБОТИ -->
    <div id="jobs-content" class="tab-pane active">
        <div class="card">
            <div class="card-header">Калькулятор Робіт</div>
            <div id="jobsCalculatorContainer" class="table-responsive"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: МАТЕРІАЛИ -->
    <div id="materials-content" class="tab-pane">
        <div class="card">
            <div class="card-header">Калькулятор Матеріалів</div>
            <div id="materialsCalculatorContainer" class="table-responsive"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: НАЛАШТУВАННЯ БАЗИ -->
    <div id="settings-content" class="tab-pane">
        <div class="card" style="border: 2px dashed #0d6efd;">
            <div class="card-header" style="background: #e0f2fe; color: #0369a1;">📥 Резервне копіювання бази</div>
            <div style="padding: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
